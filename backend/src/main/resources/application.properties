spring.application.name=RFID

# Timezone Configuration - Force IST to ensure correct timestamps across the app
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jackson.time-zone=Asia/Kolkata

# Server Configuration
server.port=${PORT:8081}
# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hibernate DDL Auto & Flyway Migration Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# H2 Console (for debugging and local development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Token Configuration (7 Days Expiration: 7 * 24 * 60 * 60 * 1000 = 604800000 ms)
jwt.secret=${JWT_SECRET:ZEN_CUBE_JWT_SUPER_SECRET_KEY_FOR_LOCAL_DEV_MUST_BE_LONG_AND_SECURE_KEYS}
jwt.expiration=${JWT_EXPIRATION:604800000}

# Tap Simulating Device Authentication Key
device.key=${DEVICE_KEY:RFTSA085E3E85280}

# Email Configuration (Requires valid Gmail SMTP credentials via Env Variables)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:vishnuchityala.ai@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:cjtexytfkwrcliqx}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# MQTT Configuration
mqtt.enabled=${MQTT_ENABLED:true}
mqtt.broker.url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client.id=${MQTT_CLIENT_ID:rfid-backend-service}
mqtt.topic.inbound=${MQTT_TOPIC_INBOUND:rfid/taps}
mqtt.topic.outbound.prefix=${MQTT_TOPIC_OUTBOUND_PREFIX:rfid/cards/}
mqtt.username=${MQTT_USERNAME:rfid_user}
mqtt.password=${MQTT_PASSWORD:Vishnu@35}
mqtt.completion-timeout=${MQTT_COMPLETION_TIMEOUT:5000}

